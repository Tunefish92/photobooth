[project]
name = "photobooth"
version = "1.2.3"
description = "Modern native photobooth application for Raspberry Pi 4"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.8",
    "tomlkit>=0.13",
    "Pillow>=10.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "httpx>=0.27",
    # Linux-only hardware integrations. Installed automatically on the Pi,
    # skipped automatically on Windows/macOS dev machines.
    "gphoto2>=2.5.1; sys_platform == 'linux'",
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
    "pycups>=2.0.4; sys_platform == 'linux'",
]

[project.scripts]
photobooth = "photobooth.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photobooth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ005: this is a single-timezone kiosk device; naive local time is correct
# for photo filenames/timestamps, not a bug.
ignore = ["DTZ005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
